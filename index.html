<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a35">
<meta name="description" content="Supervivència · Emergències — guia pràctica per estar preparat davant d'una emergència.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supervivència">
<link rel="manifest" href="manifest.json?v=7">
<link rel="icon" href="icon.svg?v=7" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png?v=7">
<link rel="stylesheet" href="styles.css?v=7">
<title>Supervivència · Emergències</title>
</head>
<body>
<div id="app">
<header class="topbar">
<button class="icon-btn" id="backBtn" aria-label="Enrere" hidden>‹</button>
<div class="brand"><img src="icon.svg?v=7" alt=""><div><strong>Supervivència</strong><span>Emergències</span></div></div>
<button class="icon-btn" id="installBtn" aria-label="Instal·lar" hidden>⬇</button>
</header>
<main id="main" tabindex="-1"></main>
<nav class="bottom-nav" aria-label="Navegació principal">
<button data-route="home"><span>🏠</span><small>Inici</small></button>
<button data-route="kit"><span>🧰</span><small>Kit</small></button>
<button data-route="bag"><span>🎒</span><small>Motxilla</small></button>
<button data-route="now"><span>🚨</span><small>Ara</small></button>
<button data-route="more"><span>☰</span><small>Més</small></button>
</nav>
</div>
<script src="app.js?v=7"></script>
<script>
(function(){
 const b=document.getElementById('backBtn');
 if(b)b.addEventListener('click',()=>window.history.back());
 document.querySelectorAll('[data-route]').forEach(x=>x.addEventListener('click',()=>{location.hash=x.dataset.route==='home'?'':x.dataset.route}));
 function active(){const r=location.hash.replace('#','').split('/')[0]||'home';document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('active',x.dataset.route===r));if(b)b.hidden=!location.hash;}
 addEventListener('hashchange',active);active();
})();
</script>
<script src="features.js?v=1"></script>
</body>
</html>
