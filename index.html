<style>
:root{--bg:#eceff0;--card:#fff;--ink:#141a19;--mut:#55625f;--y:#f5cf00;--red:#c9301f;--ok:#1f7a4d;--line:#d3d9da;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#101514;--card:#1b2321;--ink:#f1f4f3;--mut:#9fb0ab;--line:#2c3836;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}header{position:sticky;top:0;z-index:5;background:var(--y);color:#141a19;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;min-height:56px}header h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}#back{display:none;border:0;background:#141a19;color:var(--y);font-size:15px;font-weight:700;border-radius:999px;padding:9px 14px;min-height:40px}main{max-width:560px;margin:0 auto;padding:14px 14px 40px}button,a{font:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--ink);outline-offset:2px}.sos{display:block;width:100%;text-align:left;border:0;background:var(--red);color:#fff;border-radius:18px;padding:20px 18px;font-weight:800;font-size:26px;line-height:1.15}.sos small{display:block;font-weight:500;font-size:15px;opacity:.92;margin-top:6px}.call{display:block;text-align:center;margin:10px 0 0;padding:13px;border-radius:12px;border:2px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:inherit}.lvl b{font-size:19px}.lvl span{color:var(--mut);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:inherit;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}.tile i{font-style:normal;font-size:28px}.tile b{font-size:16px}.tile em{font-style:normal;font-weight:800;color:var(--ok)}.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar div{height:100%;background:var(--ok);transition:width .25s}h2{font-size:20px;margin:22px 0 8px}h3{font-size:16px;margin:18px 0 6px;color:var(--mut)}.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);min-height:48px}.chk input{width:24px;height:24px;margin:1px 0 0;accent-color:var(--ok);flex:none}.chk.on span{text-decoration:line-through;color:var(--mut)}.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;font-weight:700;font-size:17px}.row i{font-style:normal;font-size:26px}ol{padding-left:0;list-style:none;counter-reset:s;margin:0}ol li{counter-increment:s;display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}ol li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--y);color:#141a19;font-weight:800;display:grid;place-items:center;font-size:14px}ul.t{padding-left:20px}ul.t li{margin:6px 0}.alert{background:var(--y);color:#141a19;border-radius:12px;padding:12px 14px;font-weight:700;margin:12px 0}label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}input[type=text],input[type=tel],textarea{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;font:inherit;min-height:46px}textarea{min-height:84px;resize:vertical}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--ink);color:var(--bg);min-height:46px}.btn.s{background:transparent;color:var(--red);border:1.5px solid var(--red);padding:8px 12px;min-height:38px;margin-top:8px}.mem{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.note{color:var(--mut);font-size:14px;margin:8px 0}#inst{display:none}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
