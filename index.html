<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a35">
<meta name="description" content="Supervivència · Emergències — guia pràctica per estar preparat davant d'una emergència.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supervivència">
<link rel="manifest" href="manifest.json?v=9">
<link rel="icon" href="icon-192.png?v=9" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=9">
<link rel="stylesheet" href="styles.css?v=16">
<title>Supervivència · Emergències</title>
</head>
<body>
<div id="app">
<header class="topbar">
<button class="icon-btn" id="backBtn" aria-label="Enrere" hidden>‹</button>
<div class="brand"><img src="icon-192.png?v=9" alt=""><div><strong>Supervivència</strong><span>Emergències</span></div></div>
<button class="icon-btn" id="installBtn" aria-label="Instal·lar app" title="Instal·lar app">⬇</button>
</header>
<main id="main" tabindex="-1"></main>
<nav class="bottom-nav" aria-label="Navegació principal">
<button data-route="home"><span>🏠</span><small>Inici</small></button>
<button data-route="kit"><span>🧰</span><small>Kit</small></button>
<button data-route="bag"><span>🎒</span><small>Motxilla</small></button>
<button data-route="now"><span>🚨</span><small>Ara</small></button>
<button data-route="phone"><span>☎️</span><small>Guia</small></button>
<button data-route="more"><span>☰</span><small>Més</small></button>
</nav>
</div>
<script src="app.js?v=18"></script>
<script>
(function(){
 let dp=null;const b=document.getElementById('installBtn');
 const st=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 if(st&&b)b.hidden=true;
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(b)b.hidden=false});
 if(b)b.addEventListener('click',async()=>{
  if(dp){dp.prompt();try{await dp.userChoice}catch(_){}dp=null;b.hidden=true}
  else if(!st)alert('Android: menú ⋮ de Chrome → «Instal·la l’aplicació». iPhone: Compartir → «Afegeix a la pantalla d’inici».');
 });
 addEventListener('appinstalled',()=>{dp=null;if(b)b.hidden=true});
 if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
<script src="features.js?v=13"></script>
</body>
</html>
